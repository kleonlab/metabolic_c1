name: PertSets
checkpoint: null
device: cuda

kwargs:
  cell_set_len: 256
  blur: 0.05
  hidden_dim: 1488
  loss: se
  sinkhorn_weight: 0.01
  energy_weight: 1.0
  regularization: 0.01
  confidence_head: false
  confidence_token: false
  n_encoder_layers: 4
  n_decoder_layers: 4
  predict_residual: true
  softplus: true
  freeze_pert: false
  transformer_decoder: false
  finetune_vci_decoder: false
  residual_decoder: false
  decoder_loss_weight: 1.0
  batch_encoder: true
  nb_decoder: false
  mask_attn: false
  use_effect_gating_token: false
  use_basal_projection: false
  distributional_loss: energy
  init_from: assets/ST-Tahoe/final.ckpt
  transformer_backbone_key: llama
  transformer_backbone_kwargs:
      max_position_embeddings: 256
      hidden_size: 1488
      intermediate_size: 5952
      num_hidden_layers: 6
      num_attention_heads: 12
      num_key_value_heads: 12
      head_dim: 124
      use_cache: false
      attention_dropout: 0.0
      hidden_dropout: 0.0
      layer_norm_eps: 1.0e-06
      pad_token_id: 0
      bos_token_id: 1
      eos_token_id: 2
      tie_word_embeddings: false
      rotary_dim: 0
      use_rotary_embeddings: false
  lora:
      enable: false
      r: 16
      alpha: 32
      dropout: 0.05
      bias: none
      target: auto
      adapt_mlp: false
      task_type: FEATURE_EXTRACTION
      merge_on_eval: false